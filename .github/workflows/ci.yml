name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: py_compile
        run: python3 -m py_compile $(git ls-files '*.py')

      # What the scout does, pinned by value; the rewrite into classes was
      # checked against these. Every door to the host (processes, signals,
      # network) is shut in scripts/_scout_harness.py, so these cannot
      # reboot or kill anything.
      - name: snapshots
        run: |
          set -e
          for t in scripts/test_scout_*.py; do
            echo "== $t"
            python3 "$t"
          done

      # The scout's shape: classes with one job each, no mixins, no modules
      # of loose functions, no abstract method left unimplemented. The
      # self-test plants each breakage and proves the guard goes red on it.
      - name: oop guard
        run: |
          set -e
          python3 scripts/check_oop.py
          python3 scripts/test_check_oop.py

      - name: boot smoke (agent serves)
        run: |
          set -e
          mkdir -p /tmp/ci
          printf '{"hostId":"ci","listenHost":"127.0.0.1","listenPort":18092,"controllerUrl":""}\n' > /tmp/ci/config.json
          python3 -m caravan_scout.app --config /tmp/ci/config.json --state /tmp/ci/state.json &
          for i in $(seq 1 20); do
            if curl -sf -o /dev/null http://127.0.0.1:18092/api/health; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:18092/api/health
          curl -sf -o /dev/null http://127.0.0.1:18092/api/state
          curl -sf -o /dev/null http://127.0.0.1:18092/
          echo "smoke OK"

  # The macOS scout runs on the system's Python 3.9. The snapshots ran only on
  # 3.12 until 2026-09-24, and the model cache's purge failed on 3.9 without a
  # red line anywhere: a live rglob walked into a folder the loop had just
  # removed. The same snapshots run on the oldest Python the fleet uses.
  snapshots-py39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: snapshots on 3.9
        run: |
          set -e
          python3 --version
          for t in scripts/test_scout_*.py scripts/test_check_oop.py; do
            echo "== $t"
            python3 "$t"
          done
